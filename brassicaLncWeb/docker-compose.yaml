

services:
  database:
    # Official Postgres image from DockerHub (we use the last version)
    image: postgres:17-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${DATABASE_USER} # The PostgreSQL user (useful to connect to the database)
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD} # The PostgreSQL password (useful to connect to the database)
      POSTGRES_DB: ${DATABASE_NAME} # The PostgreSQL default database (automatically created at first launch)
    env_file:
      - .env
    volumes:
      - ./db-data/:/var/lib/postgresql/data/